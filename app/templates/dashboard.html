<!DOCTYPE html>
<html>

<head>
    <title>MyQuant 主控台 v6.0</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #0b0e11;
            color: #eaecef;
            padding: 20px;
            font-family: 'Segoe UI', sans-serif;
        }

        .monitor-card {
            background: #1e2329;
            border: 1px solid #2b3139;
            border-radius: 8px;
            margin-bottom: 20px;
            overflow: hidden;
            position: relative;
        }

        .price-section {
            padding: 15px;
            border-bottom: 1px solid #2b3139;
            text-align: center;
        }

        .coin-title {
            font-size: 1.1rem;
            color: #848e9c;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .price-big {
            font-size: 2.2rem;
            font-weight: bold;
            color: #f0b90b;
            letter-spacing: 1px;
        }

        .control-bar {
            background: #161a1e;
            padding: 8px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2b3139;
        }

        .tf-select {
            background: #2b3139;
            color: #eaecef;
            border: 1px solid #474d57;
            font-size: 12px;
            padding: 2px 5px;
            border-radius: 4px;
            cursor: pointer;
            outline: none;
        }

        .tf-select:focus {
            border-color: #f0b90b;
        }

        .indicator-section {
            padding: 15px;
            font-size: 0.9rem;
        }

        .ind-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px dashed #2b3139;
        }

        .ind-row:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }

        .label {
            color: #848e9c;
        }

        .val-blue {
            color: #2962FF;
            font-weight: bold;
        }

        .val-up {
            color: #0ecb81;
        }

        .val-down {
            color: #f6465d;
        }

        .strategy-btn {
            width: 100%;
            padding: 15px;
            border: none;
            font-weight: bold;
            color: #000;
            border-radius: 8px;
            font-size: 1.1rem;
            transition: transform 0.2s;
            margin-bottom: 15px;
        }

        .strategy-btn:hover {
            transform: translateY(-2px);
        }

        .btn-spot {
            background: linear-gradient(135deg, #f0b90b 0%, #d8a70a 100%);
        }

        .btn-future {
            background: linear-gradient(135deg, #e1e1e1 0%, #999 100%);
            border: 2px solid #f0b90b;
        }
    </style>
</head>

<body>
    <div class="container" style="max-width: 1400px;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="text-light m-0">🌍 全市场监控</h3>
            <div class="d-flex align-items-center">
                <select id="market-source" class="form-select form-select-sm bg-dark text-light border-secondary me-3"
                    style="width: 120px;" onchange="changeSource(this.value)">
                    <option value="binance">Binance</option>
                    <option value="okx">OKX</option>
                    <option value="coinbase">Coinbase</option>
                </select>

                <span class="badge bg-dark border border-secondary p-2 me-3"
                    style="font-family: monospace; font-size: 0.9rem;">
                    <span id="clock-bj">--:--</span> <span class="text-muted">|</span> <span id="clock-ny">--:--</span>
                </span>

                <span class="badge bg-dark border border-secondary">按需订阅 · 实时数据 <small id="latency-val"
                        class="ms-1 val-up">-- ms</small></span>
            </div>
        </div>

        <div class="row">
            <div class="col-lg-8">
                <div class="card monitor-card mb-4 h-100">
                    <div class="card-header d-flex justify-content-between align-items-center"
                        style="border-bottom: 1px solid #2b3139;">
                        <span style="color: #a78bfa; font-weight: bold;">🖥️ SERVER STATUS (VPS)</span>
                        <div>
                            <span class="badge bg-dark border border-success text-success me-2"
                                style="font-family: monospace;">
                                HB: <span id="heartbeat-counter">--</span>s
                            </span>
                            <button class="btn btn-sm btn-outline-secondary" data-bs-toggle="modal"
                                data-bs-target="#settingsModal">
                                ⚙️ 设置
                            </button>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="row g-4">
                            <div class="col-md-4">
                                <h6 class="text-muted small mb-3">HARDWARE</h6>

                                <div class="d-flex justify-content-between small mb-1">
                                    <span>CPU</span>
                                    <span id="sys-cpu-val" class="text-warning">--%</span>
                                </div>
                                <div class="progress mb-3" style="height: 6px; background-color: #2b3139;">
                                    <div id="sys-cpu-bar" class="progress-bar bg-warning" role="progressbar"
                                        style="width: 0%"></div>
                                </div>

                                <div class="d-flex justify-content-between small mb-1">
                                    <span>MEM</span>
                                    <span id="sys-mem-val" class="text-info">--%</span>
                                </div>
                                <div class="progress mb-3" style="height: 6px; background-color: #2b3139;">
                                    <div id="sys-mem-bar" class="progress-bar bg-info" role="progressbar"
                                        style="width: 0%"></div>
                                </div>

                                <div class="d-flex justify-content-between small mb-1">
                                    <span>DISK</span>
                                    <span id="sys-disk-val" class="text-secondary">--%</span>
                                </div>
                                <div class="progress" style="height: 6px; background-color: #2b3139;">
                                    <div id="sys-disk-bar" class="progress-bar bg-secondary" role="progressbar"
                                        style="width: 0%"></div>
                                </div>
                            </div>

                            <div class="col-md-4 border-start border-secondary ps-4">
                                <h6 class="text-muted small mb-3">NETWORK SPEED</h6>
                                <div class="d-flex align-items-center mb-3">
                                    <span class="display-6 me-2 text-success">↑</span>
                                    <div>
                                        <div class="small text-muted">UPLOAD</div>
                                        <div class="fs-5 text-white" style="font-family: monospace;"><span
                                                id="sys-up">--</span> KB/s</div>
                                    </div>
                                </div>
                                <div class="d-flex align-items-center">
                                    <span class="display-6 me-2 text-primary">↓</span>
                                    <div>
                                        <div class="small text-muted">DOWNLOAD</div>
                                        <div class="fs-5 text-white" style="font-family: monospace;"><span
                                                id="sys-down">--</span> KB/s</div>
                                    </div>
                                </div>
                            </div>

                            <div class="col-md-4 border-start border-secondary ps-4">
                                <div class="d-flex justify-content-between align-items-center mb-3">
                                    <h6 class="text-muted small m-0">STATISTICS</h6>
                                    <span class="badge bg-dark border border-secondary text-light small"
                                        style="font-family: monospace;">
                                        UPTIME: <span id="sys-uptime">--</span>
                                    </span>
                                </div>

                                <div class="d-flex align-items-center mb-3">
                                    <span class="fs-4 me-3 text-success">↑</span>
                                    <div class="w-100">
                                        <div class="d-flex justify-content-between">
                                            <span class="small text-muted">TOTAL</span>
                                            <span class="small text-white" style="font-family: monospace;"
                                                id="sys-total-up">-- G</span>
                                        </div>
                                        <div class="d-flex justify-content-between">
                                            <span class="small text-muted">AVG</span>
                                            <span class="small text-white" style="font-family: monospace;"
                                                id="sys-daily-up">-- G/d</span>
                                        </div>
                                    </div>
                                </div>

                                <div class="d-flex align-items-center">
                                    <span class="fs-4 me-3 text-primary">↓</span>
                                    <div class="w-100">
                                        <div class="d-flex justify-content-between">
                                            <span class="small text-muted">TOTAL</span>
                                            <span class="small text-white" style="font-family: monospace;"
                                                id="sys-total-down">-- G</span>
                                        </div>
                                        <div class="d-flex justify-content-between">
                                            <span class="small text-muted">AVG</span>
                                            <span class="small text-white" style="font-family: monospace;"
                                                id="sys-daily-down">-- G/d</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="row" id="market-row">
                    <div class="col-12 text-center text-muted py-5">
                        <div class="spinner-border text-warning" role="status"></div>
                        <div class="mt-2">正在连接行情数据中心...</div>
                    </div>
                </div>
            </div>
        </div>

        <h4 class="mt-5 mb-3 text-light">🚀 策略控制中心</h4>
        <div class="row">
            <div class="col-md-4">
                <button class="strategy-btn btn-future" onclick="window.open('/future_grid_panel', '_blank')">
                    <span>🔥 合约网格 (Futures)</span>
                    <div style="font-size: 0.8rem; font-weight: normal; margin-top: 5px; opacity: 0.8;">
                        支持杠杆 · 资金费率 · 双向持仓
                    </div>
                </button>
            </div>
            <div class="col-md-4">
                <button class="strategy-btn btn-future"
                    style="background: linear-gradient(135deg, #6366f1 0%, #4338ca 100%); border: 2px solid #a5b4fc;"
                    onclick="window.open('/autopilot', '_blank')">
                    <span>🤖 AutoPilot (信号驾驶)</span>
                    <div style="font-size: 0.8rem; font-weight: normal; margin-top: 5px; opacity: 0.8;">
                        SMI信号驱动 · 自动开平仓
                    </div>
                </button>
            </div>
        </div>
    </div>

    <div class="modal fade" id="settingsModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content" style="background:#1e2329; color:#fff; border:1px solid #3b3f46;">
                <div class="modal-header" style="border-bottom:1px solid #2b3139;">
                    <h5 class="modal-title">🔔 通知设置 (Blind Config)</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label text-muted">Telegram Token</label>
                        <input type="password" class="form-control bg-dark text-white border-secondary" id="tg_token"
                            placeholder="输入 Token (不回显)">
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-muted">Telegram Chat ID</label>
                        <input type="password" class="form-control bg-dark text-white border-secondary" id="tg_chat_id"
                            placeholder="输入 Chat ID (不回显)">
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-muted">Discord Webhook</label>
                        <input type="password" class="form-control bg-dark text-white border-secondary"
                            id="discord_webhook" placeholder="输入 Webhook URL (不回显)">
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-muted">报警冷却间隔 (分钟)</label>
                        <input type="number" class="form-control bg-dark text-white border-secondary"
                            id="alert_interval" value="15">
                    </div>
                    <small class="text-muted">* 敏感信息仅用于写入，刷新页面后不会显示。</small>
                </div>
                <div class="modal-footer" style="border-top:1px solid #2b3139;">
                    <button type="button" class="btn btn-outline-info me-auto" onclick="triggerTestNotify()">🧪
                        测试发送</button>
                    <button type="button" class="btn btn-primary" onclick="saveNotificationConfig()">💾 保存配置</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        function triggerTestNotify() {
            // 1. 获取当前输入框的值 (用户可能刚填完还没保存)
            const tgToken = document.getElementById('tg_token').value;
            const tgChatId = document.getElementById('tg_chat_id').value;
            const discordUrl = document.getElementById('discord_webhook').value;

            if (!tgToken && !discordUrl) {
                alert("请先填写 Telegram Token 或 Discord Webhook 链接");
                return;
            }

            if (!confirm("确定要发送测试消息吗？\n(这将保存当前配置并触发一次即时推送)")) return;

            // 2. 复用保存逻辑，但带上 test_trigger 标记
            fetch('/api/autopilot/status')
                .then(r => r.json())
                .then(data => {
                    let config = data.config || {};
                    if (!config.notification) config.notification = {};

                    // 核心逻辑: 写入一次性触发标记
                    config.notification.test_trigger = true;

                    // 更新配置值
                    if (tgToken) config.notification.tg_token = tgToken;
                    if (tgChatId) config.notification.tg_chat_id = tgChatId;
                    if (discordUrl) config.notification.discord_webhook = discordUrl;

                    return fetch('/api/autopilot/update_config', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(config)
                    });
                })
                .then(r => r.json())
                .then(res => {
                    if (res.status === 'ok') {
                        alert('🚀 测试指令已发出！\n后端将在下一次心跳 (约2秒内) 处理发送请求。');
                    } else {
                        alert('❌ 指令发送失败: ' + res.msg);
                    }
                })
                .catch(err => alert('错误: ' + err));
        }

        function saveNotificationConfig() {
            fetch('/api/autopilot/status')
                .then(r => r.json())
                .then(data => {
                    let config = data.config || {};
                    if (!config.notification) config.notification = {};
                    const tgToken = document.getElementById('tg_token').value;
                    const tgChatId = document.getElementById('tg_chat_id').value;
                    const discordUrl = document.getElementById('discord_webhook').value;
                    const interval = document.getElementById('alert_interval').value;

                    if (tgToken) config.notification.tg_token = tgToken;
                    if (tgChatId) config.notification.tg_chat_id = tgChatId;
                    if (discordUrl) config.notification.discord_webhook = discordUrl;
                    config.notification.interval_minutes = parseInt(interval);

                    return fetch('/api/autopilot/update_config', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(config)
                    });
                })
                .then(r => r.json())
                .then(res => {
                    if (res.status === 'ok') {
                        alert('✅ 通知配置已保存');
                        document.getElementById('tg_token').value = '';
                        document.getElementById('tg_chat_id').value = '';
                        document.getElementById('discord_webhook').value = '';
                        var myModal = bootstrap.Modal.getInstance(document.getElementById('settingsModal'));
                        myModal.hide();
                    } else {
                        alert('❌ 保存失败: ' + res.msg);
                    }
                })
                .catch(err => alert('错误: ' + err));
        }

        function updateClock() {
            const now = new Date();
            const bjTime = new Date(now.getTime() + (now.getTimezoneOffset() * 60000) + (3600000 * 8));
            document.getElementById('clock-bj').innerText = "BJ " + bjTime.toLocaleTimeString('en-GB', { hour12: false });
            const nyTime = new Date().toLocaleString("en-US", { timeZone: "America/New_York", hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
            document.getElementById('clock-ny').innerText = "NY " + nyTime;
        }
        setInterval(updateClock, 1000);
        updateClock();

        function changeSource(source) {
            if (!confirm(`确认切换行情源到 ${source}? 可能会有短暂数据中断。`)) {
                location.reload();
                return;
            }
            fetch('/api/system/update_source', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ source: source })
            }).then(r => r.json()).then(res => {
                if (res.status === 'ok') { alert('切换成功，数据源已更新'); } else { alert('切换失败: ' + res.msg); }
            });
        }

        const ALL_TFS = ['5m', '15m', '1h', '2h', '4h', '8h', '12h', '1d'];
        const pendingTFs = {};

        function renderMarket(data) {
            // [Update] Probe Stats (Cockpit Mode)
            if (data["BTC/USDT"]) {
                const btc = data["BTC/USDT"];
                if (btc.sys_cpu !== undefined) {
                    document.getElementById('sys-cpu-val').innerText = btc.sys_cpu + '%';
                    document.getElementById('sys-cpu-bar').style.width = btc.sys_cpu + '%';
                    document.getElementById('sys-mem-val').innerText = btc.sys_mem + '%';
                    document.getElementById('sys-mem-bar').style.width = btc.sys_mem + '%';
                    document.getElementById('sys-disk-val').innerText = btc.sys_disk + '%';
                    document.getElementById('sys-disk-bar').style.width = btc.sys_disk + '%';
                    document.getElementById('sys-up').innerText = btc.sys_up;
                    document.getElementById('sys-down').innerText = btc.sys_down;
                    // Stats Mapping
                    document.getElementById('sys-uptime').innerText = btc.sys_uptime;

                    document.getElementById('sys-total-up').innerText = btc.sys_total_up;
                    document.getElementById('sys-daily-up').innerText = btc.sys_daily_up;

                    document.getElementById('sys-total-down').innerText = btc.sys_total_down;
                    document.getElementById('sys-daily-down').innerText = btc.sys_daily_down;
                    resetHeartbeat();
                }
            }

            const activeElement = document.activeElement;
            if (activeElement && activeElement.tagName === 'SELECT') return;

            const container = document.getElementById('market-row');
            let html = '';

            for (const [symbol, d] of Object.entries(data)) {
                const smiVal = Number(d.smi).toFixed(5);
                const sigVal = Number(d.sig).toFixed(5);
                const rsiVal = Number(d.rsi).toFixed(2);

                if (d.latency !== undefined) {
                    const latEl = document.getElementById('latency-val');
                    if (latEl) {
                        latEl.innerText = d.latency + " ms";
                        latEl.className = "ms-1 " + (d.latency < 200 ? "val-up" : (d.latency > 500 ? "val-down" : "text-warning"));
                    }
                }
                if (d.source) {
                    const sourceSel = document.getElementById('market-source');
                    if (sourceSel && sourceSel.value !== d.source && document.activeElement !== sourceSel) {
                        sourceSel.value = d.source;
                    }
                }

                const rsiClass = d.rsi > 70 ? 'val-down' : (d.rsi < 30 ? 'val-up' : 'text-light');
                let displayTF = d.tf;
                if (pendingTFs[symbol]) {
                    if (pendingTFs[symbol] === d.tf) {
                        delete pendingTFs[symbol];
                    } else {
                        displayTF = pendingTFs[symbol];
                    }
                }

                let optionsHtml = '';
                ALL_TFS.forEach(tf => {
                    const isSelected = (displayTF === tf) ? 'selected' : '';
                    optionsHtml += `<option value="${tf}" ${isSelected}>${tf}</option>`;
                });

                const slug = symbol.replace('/', '_');
                // 【核心修改】col-md-4 -> col-12，让其在侧边栏占满宽度
                html += `
            <div class="col-12">
                <div class="monitor-card">
                    <div class="price-section" style="cursor:pointer;" onclick="window.location.href='/chart/${slug}'">
                        <div class="coin-title">
							${symbol} <span style="font-size:0.8rem">📊</span>
						</div>	
                        <div class="price-big">${d.price}</div>
                    </div>
                    
                    <div class="control-bar">
                        <span class="text-muted small">监控周期</span>
                        <select class="tf-select" onchange="changeTF(this, '${symbol}', this.value)">
                            ${optionsHtml}
                        </select>
                    </div>
                    
                    <div class="indicator-section">
                        <div class="ind-row">
                            <span class="label">RSI (14)</span>
                            <span class="${rsiClass}">${rsiVal}</span>
                        </div>
                        <div class="ind-row">
                            <span class="label">SMI (蓝线)</span>
                            <span class="val-blue">${smiVal}</span>
                        </div>
                        <div class="ind-row">
                            <span class="label">Signal (橙线)</span>
                            <span class="text-muted">${sigVal}</span>
                        </div>
                    </div>
                </div>
            </div>`;
            }
            container.innerHTML = html;
        }

        function changeTF(el, symbol, newTF) {
            el.blur();
            pendingTFs[symbol] = newTF;
            fetch('/api/set_timeframe', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ symbol: symbol, tf: newTF })
            }).then(r => r.json()).then(res => {
                console.log(`[Switch] ${symbol} -> ${newTF}`);
            });
        }

        let countdown = 0;
        let hbInterval = null;
        function resetHeartbeat() {
            countdown = 4;
            updateHbDisplay();
            if (hbInterval) clearInterval(hbInterval);
            hbInterval = setInterval(() => {
                countdown -= 1;
                if (countdown < 0) countdown = 0;
                updateHbDisplay();
            }, 1000);
        }
        function updateHbDisplay() {
            const el = document.getElementById('heartbeat-counter');
            if (el) el.innerText = countdown;
        }

        setInterval(() => {
            fetch('/api/market_status').then(r => r.json()).then(data => { renderMarket(data); });
        }, 4000);
    </script>
</body>

</html>
